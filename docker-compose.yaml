services:
  # One-shot: issues the wildcard cert (fqrmix.ru, *.fqrmix.ru,
  # *.yoomoney-services.fqrmix.ru, *.services.fqrmix.ru) via DNS-01 against Beget, using
  # acme.sh's official bundled dns_beget hook (no custom script needed -
  # it ships in the image's dnsapi/ dir), then installs the result into
  # the shared `certs` volume at a fixed, predictable path. Runs once per
  # `docker compose up`; a no-op if acme.sh's own state (in `acme_state`)
  # already has a valid, unexpired cert for these names.
  acme_issue:
    image: neilpang/acme.sh
    container_name: sm_bot_acme_issue
    env_file:
      - .env
    volumes:
      - acme_state:/acme.sh
      - certs:/certs
      - ./acme/issue.sh:/issue.sh:ro
    entrypoint: ["/bin/sh", "/issue.sh"]
    networks:
      - sm_bot_net

  # Long-running: acme.sh's built-in cron checks daily and renews ~30 days
  # before expiry, reusing the --install-cert target remembered from the
  # issue step above. nginx picks up the renewed files on its own 12h
  # reload timer (see nginx/docker-entrypoint-reload.sh) - no signalling
  # between these two containers required.
  acme_renew:
    image: neilpang/acme.sh
    container_name: sm_bot_acme_renew
    restart: unless-stopped
    env_file:
      - .env
    command: ["daemon"]
    volumes:
      - acme_state:/acme.sh
      - certs:/certs
    depends_on:
      acme_issue:
        condition: service_completed_successfully
    networks:
      - sm_bot_net

  nginx:
    # `docker compose up --build` still builds locally. On the server,
    # `docker compose pull && docker compose up -d` uses the image CI
    # pushes on every merge to master instead - see
    # .github/workflows/ci.yml. Requires `docker login ghcr.io` on the
    # server first if the ghcr.io/fqrmix/nginx-front-balancer package is
    # private.
    build: ./nginx
    image: ghcr.io/fqrmix/nginx-front-balancer:latest
    container_name: nginx_balancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
      - ./www:/var/www:ro
    depends_on:
      acme_issue:
        condition: service_completed_successfully
    networks:
      - sm_bot_net

volumes:
  # acme.sh's account key + per-domain renewal config - losing this means
  # re-issuing from scratch (fine) but losing the --install-cert linkage
  # (means re-running acme_issue's install-cert manually after a renewal).
  acme_state:
  # Just the installed fullchain/privkey nginx actually reads.
  certs:

networks:
  # Shared with sm_bot_golang/deploy/docker-compose.yaml,
  # sm_bot_admin/deploy/docker-compose.yaml and
  # proxy-manager/docker-compose.yml - created by whichever of these
  # stacks starts first (docker compose creates a network declared
  # non-external the first time; here it's always external because this
  # repo doesn't own it).
  sm_bot_net:
    external: true
