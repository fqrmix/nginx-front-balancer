# Catches any request whose Host header doesn't match one of the named
# server blocks below (bots/scanners hitting the bare IP, typos, etc.)
# instead of silently falling through to whichever server block happens
# to be first.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fqrmix.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fqrmix.ru/privkey.pem;

    return 444;
}
