server {
    listen 80;
    server_name fqrmix.ru www.fqrmix.ru;
    return 301 https://fqrmix.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name fqrmix.ru www.fqrmix.ru;

    ssl_certificate     /etc/nginx/certs/fqrmix.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fqrmix.ru/privkey.pem;

    root /var/www/fqrmix-placeholder;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
