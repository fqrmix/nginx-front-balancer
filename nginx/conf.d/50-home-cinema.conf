server {
    listen 80;
    server_name cinema.services.fqrmix.ru jellyfin.services.fqrmix.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cinema.services.fqrmix.ru;

    ssl_certificate     /etc/nginx/certs/fqrmix.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fqrmix.ru/privkey.pem;

    # home-cinema lives in a separate compose project with its own
    # lifecycle - resolving the hostname through a variable (rather than
    # a bare proxy_pass target) defers DNS lookup to request time via
    # Docker's embedded resolver, so nginx still starts even if that
    # container isn't up yet (a request just 502s until it is).
    resolver 127.0.0.11 valid=30s;

    # home-cinema's own nginx container already proxies /api/ to its
    # backend over that stack's internal network - this vhost only needs
    # to reach that nginx, not the backend directly (same shape as
    # proxy-manager above).
    location / {
        set $upstream_cinema http://home_cinema_nginx:80;
        proxy_pass $upstream_cinema;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name jellyfin.services.fqrmix.ru;

    ssl_certificate     /etc/nginx/certs/fqrmix.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fqrmix.ru/privkey.pem;

    resolver 127.0.0.11 valid=30s;

    # Jellyfin's web client holds a WebSocket open for session/playback
    # sync; without the upgrade headers it silently falls back to
    # polling-ish behavior instead of erroring, which is easy to miss.
    location / {
        set $upstream_jellyfin http://home_cinema_jellyfin:8096;
        proxy_pass $upstream_jellyfin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
