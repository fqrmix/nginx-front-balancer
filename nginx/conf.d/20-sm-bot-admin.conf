server {
    listen 80;
    server_name sm-bot.yoomoney-services.fqrmix.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sm-bot.yoomoney-services.fqrmix.ru;

    ssl_certificate     /etc/nginx/certs/fqrmix.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fqrmix.ru/privkey.pem;

    # sm_bot_admin lives in a separate compose project with its own
    # lifecycle - resolving the hostname through a variable (rather than
    # a bare proxy_pass target) defers DNS lookup to request time via
    # Docker's embedded resolver, so nginx still starts even if that
    # container isn't up yet (a request just 502s until it is).
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_admin http://sm_bot_admin:80;
        proxy_pass $upstream_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
