server {
    listen 80;
    server_name proxy.services.fqrmix.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name proxy.services.fqrmix.ru;

    ssl_certificate     /etc/nginx/certs/fqrmix.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fqrmix.ru/privkey.pem;

    # proxy-manager lives in a separate compose project with its own
    # lifecycle - resolving the hostname through a variable (rather than
    # a bare proxy_pass target) defers DNS lookup to request time via
    # Docker's embedded resolver, so nginx still starts even if that
    # container isn't up yet (a request just 502s until it is).
    resolver 127.0.0.11 valid=30s;

    # The frontend container's own nginx already proxies /api/ and
    # /health to the backend over proxy-manager's internal network - this
    # vhost only needs to reach the frontend, not the backend directly.
    location / {
        set $upstream_frontend http://proxy_manager_frontend:80;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
