server {
    listen 80;
    server_name api.yoomoney-services.fqrmix.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.yoomoney-services.fqrmix.ru;

    ssl_certificate     /etc/nginx/certs/fqrmix.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fqrmix.ru/privkey.pem;

    # CSV schedule uploads go through here; the default 1m body limit is
    # too small for a full month's worth of employees.
    client_max_body_size 10m;

    # sm_bot_golang lives in a separate compose project with its own
    # lifecycle - resolving the hostname through a variable (rather than
    # a bare proxy_pass target) defers DNS lookup to request time via
    # Docker's embedded resolver, so nginx still starts even if that
    # container isn't up yet (a request just 502s until it is).
    resolver 127.0.0.11 valid=30s;

    # sm_bot_golang's chi router mounts every route at the root
    # (/settings/, /users/, /csv/shifts, ...) - the trailing slash on
    # proxy_pass below strips the /smbot prefix so paths line up.
    location /smbot/ {
        set $upstream_api http://sm_bot_golang:7772/;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
