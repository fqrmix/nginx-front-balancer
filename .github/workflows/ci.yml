name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nginx config syntax
        run: |
          mkdir -p /tmp/certs/fqrmix.ru
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/certs/fqrmix.ru/privkey.pem \
            -out /tmp/certs/fqrmix.ru/fullchain.pem \
            -subj "/CN=fqrmix.ru"
          docker run --rm \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "/tmp/certs:/etc/nginx/certs:ro" \
            -v "$PWD/www:/var/www:ro" \
            nginx:1.27-alpine nginx -t

      - run: sh -n acme/issue.sh

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nginx-front-balancer
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
